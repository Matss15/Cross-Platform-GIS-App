<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Fire incident reporting and emergency response GIS for BFP Rosario, Batangas.">
  <meta name="theme-color" content="#11171a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BFP Rescue Connect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>BFP Rescue Connect | Rosario</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #11171a;
      color: #f3f6f7;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      box-sizing: border-box;
      background: #11171a;
      transition: opacity 180ms ease;
    }

    #app-loading.ready {
      opacity: 0;
      pointer-events: none;
    }

    .loading-content {
      width: min(320px, 100%);
      text-align: center;
    }

    .loading-mark {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border: 3px solid #20a36a;
      border-radius: 50%;
      background: #172126;
      color: #20a36a;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 0 0 8px rgba(32, 163, 106, 0.12);
    }

    .loading-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .loading-copy {
      margin: 8px 0 22px;
      color: #aab5ba;
      font-size: 14px;
    }

    .loading-track {
      height: 3px;
      overflow: hidden;
      border-radius: 2px;
      background: #29343a;
    }

    .loading-bar {
      width: 42%;
      height: 100%;
      background: #20a36a;
      animation: loading 1.1s ease-in-out infinite;
    }

    @keyframes loading {
      from { transform: translateX(-110%); }
      to { transform: translateX(340%); }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-content">
      <div class="loading-mark" aria-hidden="true">BFP</div>
      <h1 class="loading-title">BFP RESCUE CONNECT</h1>
      <p class="loading-copy">Preparing secure workspace...</p>
      <div class="loading-track" aria-hidden="true">
        <div class="loading-bar"></div>
      </div>
    </div>
  </div>
  <noscript>This application requires JavaScript.</noscript>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) {
          registration.unregister();
        });
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');
      if (!loading) return;
      loading.classList.add('ready');
      window.setTimeout(function () { loading.remove(); }, 200);
    });
  </script>
  <script src="service_bootstrap.js" type="module"></script>
</body>
</html>
